[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cypher-osint"
version = "0.1.0"
description = "AI-orchestrated OSINT framework: pluggable modules, Claude planning, unified reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
cli = ["rich>=13.0"]
dotenv = ["python-dotenv>=1.0"]
dev = ["pytest>=8.0"]
all = ["anthropic>=0.40", "rich>=13.0", "python-dotenv>=1.0", "pytest>=8.0"]

[project.scripts]
cypher = "cypher.cli:main"

[tool.setuptools.packages.find]
include = ["cypher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
